name: LLM Probe 2 (endpoints)

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          tok = os.environ["GITHUB_TOKEN"]
          targets = [
              ("models.github.ai/inference", "https://models.github.ai/inference/chat/completions"),
              ("models.github.ai/v1", "https://models.github.ai/v1/chat/completions"),
              ("models.inference.ai.azure.com", "https://models.inference.ai.azure.com/chat/completions"),
          ]
          for name, url in targets:
              payload = {"model": "gpt-4o-mini",
                         "messages": [{"role": "user", "content": "reply: ok"}],
                         "max_tokens": 5}
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      body = r.read().decode()
                      print(name, "|", r.status, "|", r.headers.get("Content-Type"), "|", body[:150].replace("\n", " "))
              except urllib.error.HTTPError as e:
                  print(name, "| HTTPERR", e.code, "|", e.read()[:150])
              except Exception as e:
                  print(name, "| FAIL", type(e).__name__, e)
          PY
