name: GitHub Trending Daily Digest

on:
  schedule:
    # 每小时的 0 分触发一次（UTC）。脚本内部有幂等保护：当天发过就跳过，
    # 所以多次触发不会重复发邮件，但能有效对抗 GitHub 定时任务偶尔丢失/延迟的问题。
    # 第一次实际发送通常落在 UTC 01:00 前后 = 北京时间 09:00 左右。
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 允许手动点按钮立即跑一次

permissions:
  contents: write         # 用于把日报归档 commit 回仓库

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成并发送日报
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python daily_digest.py

      - name: 归档日报到仓库
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "没有新归档，跳过提交"
            exit 0
          fi
          git commit -m "日报归档 $(date +%F)"
          # 并发/他人提交时先 rebase 再推，最多重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "推送失败，重试第 $i 次"
            sleep 5
          done
