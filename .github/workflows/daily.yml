name: GitHub Trending Daily Digest

on:
  schedule:
    # UTC 1:00 = 北京时间每天早上 9:00（GitHub 服务器云端触发，与你的电脑无关）
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # 允许手动点按钮立即跑一次

permissions:
  contents: write         # 用于把日报归档 commit 回仓库

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成并发送日报
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python daily_digest.py

      - name: 归档日报到仓库
        if: hashFiles('digests/*.md') != ''
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digests/
          git diff --cached --quiet || (git commit -m "日报归档 $(date +%F)" && git push)
