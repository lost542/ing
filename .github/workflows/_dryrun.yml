name: Dry Run Digest (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare in scratch dir (no send, no commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_SEND: "1"
          MAX_ITEMS: "6"
        run: |
          mkdir -p /tmp/run
          cp daily_digest.py /tmp/run/
          cp -r digests /tmp/run/
          cd /tmp/run
          D=$(date -u +%F)
          rm -f "digests/$D.md" "digests/$D.html" digests/.sent-*
          python daily_digest.py --prepare
          echo "------ 目录 ------"
          grep -E "^## |^### " "digests/$D.md" || true
          echo "------ 正文前 26 行 ------"
          head -26 "digests/$D.md" || true
